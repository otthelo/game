# Production-like local stack: built client + Colyseus + PostgreSQL + Redis.
#
#   npm run prod:up        build and start everything at http://localhost:8080
#   npm run prod:down      stop (volumes are kept)
#   npm run prod:tunnel    also start a Cloudflare Quick Tunnel for friends
#   npm run prod:logs      follow logs
#
# Requires a root .env file (see .env.example).

name: pixel-realms-prod

x-server-env: &server-env
  NODE_ENV: production
  PORT: 2567
  HOST: 0.0.0.0
  MAX_PLAYERS: ${MAX_PLAYERS:-50}
  PERSIST_INTERVAL_MS: 15000
  # nginx is one proxy hop; it forwards the real client IP for rate limiting.
  TRUST_PROXY: 1
  AUTH_TOKEN_TTL_HOURS: 168
  AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
  CLIENT_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pixel_realms
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixel_realms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pixel_realms"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    image: pixel-realms-server:local
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment: *server-env
    # Migrations are idempotent; running them before boot keeps the stack
    # single-command on a fresh machine.
    command: ["sh", "-c", "node dist/database/migrate.js && node dist/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2567/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: pixel-realms-client:local
    build:
      context: .
      dockerfile: Dockerfile.client
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # Optional public URL for remote friends:
  #   docker compose -f docker-compose.prod.yml --profile tunnel up -d
  # Read the generated https://*.trycloudflare.com address from the logs.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:80"]
    depends_on:
      web:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
