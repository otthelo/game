# Local development services for Pixel Realms.
#
#   npm run services:up     start PostgreSQL + Redis (waits until healthy)
#   npm run services:down   stop them (data is kept in named volumes)
#   npm run db:migrate      apply server/migrations/*.sql
#
# The server reads the matching URLs from server/.env. See readme.md.

name: pixel-realms

services:
  postgres:
    image: postgres:16-alpine
    container_name: pixel-realms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixel_realms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 on the host avoids clashing with a default local PostgreSQL.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pixel_realms"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: pixel-realms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  redis-data:
